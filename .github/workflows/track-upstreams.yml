name: Track upstream engineering research
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public source metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_upstreams.py
      - name: Commit metadata snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/upstream_status.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: refresh upstream project metadata"
            git push
          fi
