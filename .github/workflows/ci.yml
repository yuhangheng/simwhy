name: Physics tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce two example scenarios
        run: |
          python -m simwhy run examples/pressurized_jump.json --out results/pulse
          python -m simwhy run examples/insufficient_thrust.json --out results/no-lift
