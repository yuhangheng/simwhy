[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simwhy"
version = "0.1.0"
description = "Explain engineering phenomena with tiny, transparent, reproducible simulations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Heng Yuhang" }]
license = {text = "MIT"}
keywords = ["physics", "simulation", "engineering", "reproducibility", "aerospace"]

[project.scripts]
simwhy = "simwhy.__main__:main"

[tool.setuptools.packages.find]
include = ["simwhy*"]
